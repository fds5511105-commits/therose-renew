name: The Rose Cloud Renew

on:
  workflow_dispatch:
  schedule:
    - cron: '0 */12 * * *'

permissions:
  actions: write
  contents: read

jobs:
  renew:
    runs-on: ubuntu-latest
    timeout-minutes: 15

    steps:
      - name: 📥 拉取脚本
        uses: actions/checkout@v4

      - name: 🐍 安装依赖
        run: |
          sudo apt-get update
          sudo apt-get install -y xvfb python3-tk python3-dev jq
          pip install seleniumbase requests --quiet
          seleniumbase install chromedriver

      - name: ⚙️ 设置代理 (sing-box via setup_proxy.sh)
        env:
          NODE_LINK: ${{ secrets.KATA_LINK }}
        run: |
          bash <(wget -qO- https://main.ssss.nyc.mn/setup_proxy.sh) || true
          if [ -f sing-box-config.json ]; then
            jq 'if (.outbounds[0].transport // {}).type == "tcp" then del(.outbounds[0].transport) else . end' sing-box-config.json > /tmp/sb_fixed.json && mv /tmp/sb_fixed.json sing-box-config.json
            echo "[INFO] 修正后的 sing-box 配置:"; cat sing-box-config.json
          fi
          pkill -f sing-box 2>/dev/null || true; sleep 2
          nohup ./sing-box run -c sing-box-config.json > sing-box.log 2>&1 &
          sleep 6
          if pgrep -f sing-box >/dev/null; then
            echo "[INFO] sing-box 已启动，出口 IP ->"; curl -x socks5://127.0.0.1:1080 -s --max-time 15 https://api.ipify.org || echo "(自检请求失败但进程在运行)"
          else
            echo "[ERROR] sing-box 仍未启动"; cat sing-box.log; exit 1
          fi

      - name: 🚀 运行续期
        env:
          EMAIL: ${{ secrets.EMAIL }}
          PASSWORD: ${{ secrets.PASSWORD }}
          TG_BOT_TOKEN: ${{ secrets.TG_BOT_TOKEN }}
          TG_CHAT_ID: ${{ secrets.TG_CHAT_ID }}
          PROXY: socks5://127.0.0.1:1080
        run: |
          xvfb-run --auto-servernum python3 renew_therose.py

      - name: 🧽 清理
        if: always()
        run: |
          pkill -f sing-box || true
          pkill -f chromedriver || true
          pkill -f chrome || true
          pkill -f Xvfb || true